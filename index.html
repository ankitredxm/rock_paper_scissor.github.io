<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <h1>Rock Paper Scissors</h1>
    </div>
    <div class="content">
        <button class="box border" id="rock"></button>
        <button class="box border" id="paper"></button>
        <button class="box border" id="Scissors"></button>
    </div>

    <div class="Scores">
        <div class="me">
             <div id="human">0</div>
            <div id="msg1">You</div>
        </div>
        <div class="comp">
             <div id="computer">0</div>
            <div id="msg2">Computer</div>
        </div>
    </div>

    <div class="message">
   <button class="msg" id="msg6">Play you Move</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
